[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rmbench-av-sim"
version = "0.1.0"
description = "Simulator-only RMBench environment interface"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {file = "LICENSE"}
dependencies = [
  "gymnasium==0.29.1",
  "huggingface-hub==0.25.0",
  "imageio==2.34.2",
  "matplotlib",
  "mplib==0.2.1",
  "numpy",
  "open3d==0.18.0",
  "opencv-python",
  "pillow",
  "pyglet<2",
  "pyyaml",
  "sapien==3.0.0b1",
  "scipy==1.10.1",
  "termcolor",
  "toppra",
  "torch==2.4.1",
  "transforms3d==0.4.2",
  "trimesh==4.4.3",
]

[tool.setuptools.packages.find]
include = ["envs*", "rmbench_sim*"]
